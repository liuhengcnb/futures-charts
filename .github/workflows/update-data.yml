name: Update Futures Data

on:
  # 允许手动触发
  workflow_dispatch:
  # 定时触发（每天下午5点）
  schedule:
    - cron: '0 9 * * *'  # UTC 9:00 = 北京时间 18:00

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须设置为write才能推送更改【turn0search28】
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas
        
    - name: Generate manifest.json
      run: |
        python -c "
        import os
        import json
        
        data_dir = 'data'
        manifest = []
        
        if os.path.exists(data_dir):
            files = sorted([f for f in os.listdir(data_dir) if f.endswith('.csv')])
            for f in files:
                # 从文件名解析显示名称
                # 格式: 工业品-建材 玻璃FG 行情图表数据.csv
                parts = f.replace(' 行情图表数据.csv', '').split(' ', 1)
                if len(parts) == 2:
                    display_name = parts[1]
                else:
                    display_name = f.replace(' 行情图表数据.csv', '')
                
                manifest.append({
                    'filename': f,
                    'display_name': display_name
                })
        
        with open(os.path.join(data_dir, 'manifest.json'), 'w', encoding='utf-8') as f:
            json.dump(manifest, f, ensure_ascii=False, indent=2)
        
        print(f'Generated manifest.json with {len(manifest)} items')
        "
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/manifest.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update manifest.json [skip ci]"
        
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main