<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期货行情图表分析</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>期货行情数据看板</h1>

        <div class="control-panel">
            <div class="control-group">
                <label for="contract-select">选择合约</label>
                <select id="contract-select">
                    <option value="">正在加载数据列表...</option>
                </select>
            </div>

            <div class="control-group">
                <label for="start-date">开始日期</label>
                <input type="date" id="start-date">
            </div>

            <div class="control-group">
                <label for="end-date">结束日期</label>
                <input type="date" id="end-date">
            </div>
        </div>

        <div id="stats-panel" class="stats-panel"></div>

        <div id="charts-container">
            <div id="kline-chart" style="width: 100%; height: 500px; margin-bottom: 20px;"></div>
            
            <div id="volume-chart" style="width: 100%; height: 200px; margin-bottom: 20px;"></div>
            
            <div id="oi-chart" style="width: 100%; height: 200px; margin-bottom: 20px;"></div>
            
            <div id="position-chart" style="width: 100%; height: 300px; margin-bottom: 20px;"></div>
            
            <div id="iv-chart" style="width: 100%; height: 300px; margin-bottom: 20px;"></div>
            
            <div id="cb-chart" style="width: 100%; height: 300px;"></div>
        </div>
    </div>

    <script src="js/csv-parser.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
