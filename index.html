<!DOCTYPE html>
<html lang="zh-CN">
<script type="text/javascript">
  // 密码验证 - 放在最前面确保第一时间执行
  function checkPassword() {
    var password = prompt("请输入访问密码：");
    if (password !== "zhuadabo") { // 这里修改为你想要的密码
      alert("密码错误，无法访问！");
      document.body.innerHTML = ""; // 清空页面内容
      window.location.href = "about:blank"; // 跳转到空白页

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期货行情图表分析</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>期货行情数据看板</h1>

        <div class="control-panel">
            <div class="control-group">
                <label for="contract-select">选择合约</label>
                <select id="contract-select">
                    <option value="">正在加载数据列表...</option>
                </select>
            </div>
            <div class="control-group">
                <label for="start-date">开始日期</label>
                <input type="date" id="start-date">
            </div>
            <div class="control-group">
                <label for="end-date">结束日期</label>
                <input type="date" id="end-date">
            </div>
            <div class="control-group">
                <label>&nbsp;</label>
                <button id="update-btn">更新图表</button>
            </div>
            <div class="control-group">
                <label>&nbsp;</label>
                <button id="reset-btn">重置日期</button>
            </div>
        </div>

        <div id="loading-overlay" style="display:none; text-align:center; padding:30px; font-size:16px;"></div>

        <div id="charts-container">
            <div id="chart-kline"    style="width:100%; height:500px; margin-bottom:20px;"></div>
            <div id="chart-volume"   style="width:100%; height:200px; margin-bottom:20px;"></div>
            <div id="chart-oi"       style="width:100%; height:200px; margin-bottom:20px;"></div>
            <div id="chart-trend"    style="width:100%; height:200px; margin-bottom:20px;"></div>
            <div id="chart-position" style="width:100%; height:300px; margin-bottom:20px;"></div>
            <div id="chart-iv"       style="width:100%; height:300px; margin-bottom:20px;"></div>
            <div id="chart-cb"       style="width:100%; height:300px;"></div>
        </div>
    </div>

    <script src="js/csv-parser.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
