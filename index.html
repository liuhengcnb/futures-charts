<!DOCTYPE html>
<html lang="zh-CN">
<script type="text/javascript">
  (function() {
    document.write('<style>html,body{display:none !important;}</style>');
    var password = prompt("请输入访问密码：");
    if (password !== "zhuadabo") {
      alert("密码错误，无法访问！");
      document.body.innerHTML = "";
      window.location.href = "about:blank";
      throw new Error("密码错误，停止执行");
    } else {
      document.write('<style>html,body{display:block !important;}</style>');
    }
  })();
</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期货行情图表</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <style>
    /* ── Tab 导航 ─────────────────────────────────────── */
    .tab-bar {
        display: flex;
        gap: 6px;
        margin: 0 0 14px;
    }
    .tab-btn {
        padding: 7px 22px;
        border: 1.5px solid #c0c8e8;
        border-radius: 6px;
        background: #f4f6fb;
        color: #4a5568;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all .18s;
        letter-spacing: .04em;
    }
    .tab-btn:hover  { background: #e8ecfa; border-color: #8fa0d8; }
    .tab-btn.active { background: #3d5afe; border-color: #3d5afe; color: #fff; box-shadow: 0 2px 8px rgba(61,90,254,.25); }

    /* ── 席位容器 ─────────────────────────────────────── */
    #seat-container { display: none; }

    .seat-msg {
        text-align: center;
        padding: 40px 0;
        font-size: 14px;
        color: #999;
    }

    .seat-page { display: flex; flex-direction: column; gap: 24px; }

    .seat-block {}
    .seat-block-title {
        font-size: 13px;
        font-weight: 700;
        color: #334;
        padding: 4px 0 6px;
        border-bottom: 1.5px solid #e0e4f0;
        margin-bottom: 8px;
        letter-spacing: .05em;
    }

    .seat-scroll-wrap {
        overflow-x: auto;
        border: 1px solid #dde2f0;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    /* ── 席位表格 ─────────────────────────────────────── */
    .seat-table {
        border-collapse: collapse;
        width: 100%;
        font-size: 11.5px;
        white-space: nowrap;
    }

    /* 表头 */
    .seat-table thead th {
        border: 1px solid #dde2f0;
        padding: 5px 6px;
        text-align: center;
        font-weight: 700;
        background: #f7f8fc;
        color: #334;
        position: sticky;
        top: 0;
        z-index: 2;
    }
    .st-corner {
        min-width: 60px;
        font-size: 11px;
        line-height: 1.4;
        color: #666 !important;
    }
    .st-corner-sub { font-size: 9px; color: #aaa; }
    .st-group { font-size: 12px; padding: 5px 10px !important; }
    .st-seat  { font-size: 10.5px; max-width: 80px; overflow: hidden; text-overflow: ellipsis; font-weight: 600 !important; }

    /* 数据行 */
    .seat-table tbody tr:hover { background: #f0f4ff; }
    .st-row-latest td { background: #fffde7 !important; }

    .st-date {
        border: 1px solid #e4e8f4;
        padding: 3px 7px;
        text-align: center;
        font-size: 11px;
        color: #555;
        background: #f9fafd;
        position: sticky;
        left: 0;
        z-index: 1;
        min-width: 58px;
    }

    /* 数据单元格：含色条 */
    .st-cell {
        border: 1px solid #e8ebf5;
        padding: 0;
        position: relative;
        overflow: hidden;
        min-width: 58px;
        max-width: 90px;
        height: 22px;
        vertical-align: middle;
    }
    .st-bar {
        position: absolute;
        top: 2px;
        bottom: 2px;
        border-radius: 2px;
        pointer-events: none;
    }
    .st-val {
        position: relative;
        z-index: 1;
        display: block;
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        padding: 0 3px;
        line-height: 22px;
    }
    </style>
</head>

<body>
    <div class="container">
        <h1>以损定仓 回测进场 日间顺势 坚决持盈</h1>

        <div class="control-panel">
            <div class="control-group">
                <label for="contract-select">选择合约</label>
                <select id="contract-select">
                    <option value="">正在加载数据列表...</option>
                </select>
            </div>
            <!-- 日期控件（席位页隐藏）-->
            <div id="date-controls" style="display:contents">
                <div class="control-group">
                    <label for="start-date">开始日期</label>
                    <input type="date" id="start-date">
                </div>
                <div class="control-group">
                    <label for="end-date">结束日期</label>
                    <input type="date" id="end-date">
                </div>
            </div>
            <div class="control-group">
                <label>&nbsp;</label>
                <button id="update-btn">更新图表</button>
            </div>
            <div class="control-group">
                <label>&nbsp;</label>
                <button id="reset-btn">重置日期</button>
            </div>
        </div>

        <!-- Tab 切换 -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tab-chart" onclick="switchTab('chart')">📊 行情图表</button>
            <button class="tab-btn"        id="tab-seat"  onclick="switchTab('seat')">🏦 席位持仓</button>
        </div>

        <div id="loading-overlay" style="display:none; text-align:center; padding:30px; font-size:16px;"></div>

        <!-- 行情图表区 -->
        <div id="charts-container">
            <div id="chart-kline"    style="width:100%; height:500px; margin-bottom:4px;"></div>
            <div id="chart-volume"   style="width:100%; height:200px; margin-bottom:4px;"></div>
            <div id="chart-oi"       style="width:100%; height:200px; margin-bottom:4px;"></div>
            <div id="chart-atr"      style="width:100%; height:200px; margin-bottom:4px;"></div>
            <div id="chart-trend"    style="width:100%; height:220px; margin-bottom:4px;"></div>
            <div id="chart-position" style="width:100%; height:300px; margin-bottom:4px;"></div>
            <div id="chart-iv"       style="width:100%; height:300px; margin-bottom:4px;"></div>
            <div id="chart-cb"       style="width:100%; height:300px;"></div>
        </div>

        <!-- 席位图表区 -->
        <div id="seat-container">
            <p class="seat-msg">请先选择合约，然后点击「席位持仓」标签</p>
        </div>
    </div>

    <script src="js/csv-parser.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
